version: '3.8'

x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/saral_hashtag_tracker
  AWS_ENDPOINT: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_FETCH_MEDIA_QUEUE_URL: http://localstack:4566/000000000000/media-sync-queue
  SQS_DOWNLOAD_MEDIA_QUEUE_URL: http://localstack:4566/000000000000/asset-download-queue
  S3_BUCKET_NAME: hashtag-media-assets
  # Add dummy values so the startup validation passes (or add real ones to a local .env file)
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-mock_token}
  META_USER_ID: ${META_USER_ID:-mock_user_id}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saral_hashtag_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=sqs,s3,secretsmanager
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  server:
    build: .
    command: npm run dev:server
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      PORT: 3000
    depends_on:
      - postgres
      - localstack
    volumes:
      - .:/app
      - /app/node_modules

  fetch_media_worker:
    build: .
    command: npm run dev:worker:fetchMedia
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack
    volumes:
      - .:/app
      - /app/node_modules

  download_media_worker:
    build: .
    command: npm run dev:worker:downloadMedia
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack
    volumes:
      - .:/app
      - /app/node_modules

  outbox_worker:
    build: .
    command: npm run dev:worker:outbox
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack
    volumes:
      - .:/app
      - /app/node_modules

  cron:
    build: .
    command: npm run dev:cron
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
