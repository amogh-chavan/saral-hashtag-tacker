version: '3.8'

x-app-env: &app-env
  # We still need to override these specific URLs because inside Docker, 
  # they need to point to the container names ('postgres' and 'localstack') 
  # instead of 'localhost' as defined in your .env file.
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/saral_hashtag_tracker
  AWS_ENDPOINT: http://localstack:4566
  SQS_FETCH_MEDIA_QUEUE_URL: http://localstack:4566/000000000000/fetch-media-queue
  SQS_DOWNLOAD_MEDIA_QUEUE_URL: http://localstack:4566/000000000000/download-media-queue

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saral_hashtag_tracker
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack-data}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  server:
    build: .
    command: npm run start:server
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      <<: *app-env
      PORT: 3000
    depends_on:
      - postgres
      - localstack


  fetch_media_worker:
    build: .
    command: npm run start:worker:fetchMedia
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack


  download_media_worker:
    build: .
    command: npm run start:worker:downloadMedia
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack


  outbox_worker:
    build: .
    command: npm run start:worker:outbox
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack


  cron:
    build: .
    command: npm run start:cron
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - localstack


volumes:
  pgdata:
